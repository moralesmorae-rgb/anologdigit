<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condensadores (capacitores)</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ENCABEZADO */
        header {
            background-color: #000000;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            border-bottom: 3px solid #ffcc00;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        header h1 {
            margin: 0;
            color: #ffcc00;
            font-size: 1.8rem;
        }

        /* CONTENEDOR PRINCIPAL */
        .container {
            width: 90%;
            max-width: 800px;
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            border-top: 5px solid #ffcc00;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-top: 120px; 
            margin-bottom: 80px;
            line-height: 1.6;
            text-align: left;
        }

        .container h2, .container h3, .container h4 {
            color: #ffcc00;
            margin-top: 30px;
        }

        .container h2 {
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-top: 0;
        }

        /* ESTILO DE LAS IMÁGENES */
        .imagen-tabla {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 25px auto;
            border: 2px solid #ffcc00;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* --- ESTILOS DEL INTERACTIVO --- */
        .herramienta-interactiva {
            background-color: #2a2a2a;
            border: 2px dashed #ffcc00;
            border-radius: 10px;
            padding: 25px;
            margin: 30px 0;
            text-align: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .herramienta-interactiva h4 {
            margin-top: 0;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Gráfico del Condensador */
        .condensador-grafico {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 25px auto;
            position: relative;
            width: 140px;
            height: 180px;
            background-color: #3b6e8c; 
            border-radius: 15px;
            border: 3px solid #234559;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            flex-direction: column;
            padding: 10px 0;
            box-sizing: border-box;
        }
