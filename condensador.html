<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condensadores (capacitores)</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ENCABEZADO */
        header {
            background-color: #000000;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            border-bottom: 3px solid #ffcc00;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        header h1 {
            margin: 0;
            color: #ffcc00;
            font-size: 1.8rem;
        }

        /* CONTENEDOR PRINCIPAL */
        .container {
            width: 90%;
            max-width: 800px;
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            border-top: 5px solid #ffcc00;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-top: 120px; 
            margin-bottom: 80px;
            line-height: 1.6;
            text-align: left;
        }

        .container h2 {
            color: #ffcc00;
            margin-top: 0;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- ENCABEZADO -->
    <header>
        <h1>Condensadores (capacitores)</h1>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="container">
        <h2>Condensadores (capacitores)</h2>
    </main>

</body>
</html>
