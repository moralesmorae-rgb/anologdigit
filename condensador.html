<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condensadores (capacitores)</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ENCABEZADO */
        header {
            background-color: #000000;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            border-bottom: 3px solid #ffcc00;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        header h1 {
            margin: 0;
            color: #ffcc00;
            font-size: 1.8rem;
        }

        /* CONTENEDOR PRINCIPAL */
        .container {
            width: 90%;
            max-width: 800px;
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            border-top: 5px solid #ffcc00;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-top: 120px; 
            margin-bottom: 80px;
            line-height: 1.6;
            text-align: left;
        }

        .container h2, .container h3, .container h4 {
            color: #ffcc00;
            margin-top: 30px;
        }

        .container h2 {
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-top: 0;
        }

        /* ESTILO DE LAS IMÁGENES */
        .imagen-tabla {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 25px auto;
            border: 2px solid #ffcc00;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* --- HERRAMIENTA INTERACTIVA (CALCULADORA CONDENSADOR) --- */
        .herramienta-interactiva {
            background-color: #2a2a2a;
            border: 2px solid #ffcc00;
            border-radius: 10px;
            padding: 25px;
            margin: 30px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .herramienta-interactiva h4 {
            margin-top: 0;
            text-align: center;
        }

        /* Gráfico interactivo del condensador */
        .condensador-grafico {
            width: 220px;
            height: 100px;
            background-color: #2b5b84; /* Cuerpo azul típico de capacitor poliéster/cerámico */
            border-radius: 15px;
            margin: 25px auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.6), 0 4px 10px rgba(0,0,0,0.5);
            border: 2px solid #1a3a54;
        }

        /* Patillas metálicas del condensador */
        .condensador-grafico::before, .condensador-grafico::after {
            content: '';
            position: absolute;
            bottom: -35px;
            width: 6px;
            height: 35px;
            background-color: #bbb;
            box-shadow: inset -1px 0 2px rgba(0,0,0,0.5);
        }

        .condensador-grafico::before {
            left: 50px;
        }

        .condensador-grafico::after {
            right: 50px;
        }

        /* Bandas de color */
        .banda {
            width: 12px;
            height: 100%;
            border-left: 1px solid rgba(0,0,0,0.2);
            border-right: 1px solid rgba(0,0,0,0.2);
            box-shadow: inset 0 0 3px rgba(0,0,0,0.5);
            transition: background-color 0.3s ease;
        }

        .controles-flex {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .controles-flex select {
            background-color: #121212;
            color: #fff;
            border: 1px solid #ffcc00;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .controles-flex select:focus {
            border-color: #ffffff;
            box-shadow: 0 0 5px #ffcc00;
        }

        .resultado-destacado {
            background-color: #121212;
            border: 2px dashed #ffcc00;
            color: #ffcc00;
            font-size: 1.4rem;
            font-weight: bold;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin-top: 25px;
        }
