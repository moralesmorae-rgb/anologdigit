<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condensadores (capacitores)</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ENCABEZADO */
        header {
            background-color: #000000;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            border-bottom: 3px solid #ffcc00;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        header h1 {
            margin: 0;
            color: #ffcc00;
            font-size: 1.8rem;
        }

        /* CONTENEDOR PRINCIPAL */
        .container {
            width: 90%;
            max-width: 800px;
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            border-top: 5px solid #ffcc00;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-top: 120px; 
            margin-bottom: 80px;
            line-height: 1.6;
            text-align: left;
            box-sizing: border-box;
        }

        .container h2, .container h3, .container h4 {
            color: #ffcc00;
            margin-top: 30px;
        }

        .container h2 {
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-top: 0;
        }

        /* ESTILO DE LAS IMÁGENES */
        .imagen-tabla {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 25px auto;
            border: 2px solid #ffcc00;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* BOTÓN DE RETORNO */
        .btn-volver {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #1e1e1e;
            border: 2px solid #ffcc00;
            color: #ffcc00;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 9999;
        }

        .btn-volver:hover {
            background-color: #ffcc00;
            color: #000000;
            transform: scale(1.03);
        }

        /* --- ESTILOS CALCULADORA INTERACTIVA DE CÓDIGO DE COLORES --- */
        .calculator-section {
            background-color: #262626;
            border: 2px solid #ffcc00;
            border-radius: 12px;
            padding: 25px;
            margin-top: 35px;
        }

        .calculator-section h3 {
            margin-top: 0;
            text-align: center;
        }

        .capacitor-visual {
            position: relative;
            width: 280px;
            height: 120px;
            margin: 20px auto 40px auto;
            background: linear-gradient(135deg, #0f738c, #053340);
            border-radius: 20px;
            border: 3px solid #ffcc00;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .capacitor-visual::before, .capacitor-visual::after {
            content: '';
            position: absolute;
            width: 35px;
            height: 6px;
            background-color: #c0c0c0;
            bottom: -35px;
        }
        .capacitor-visual::before { left: 70px; }
        .capacitor-visual::after { right: 70px; }

        .bands-container {
            display: flex;
            gap: 12px;
            height: 100%;
            align-items: center;
            width: 80%;
            justify-content: center;
        }

        .band-visual {
            width: 18px;
            height: 100%;
            background-color: #000000;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            transition: background-color 0.3s ease;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 25px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

            font-size: 0
